name: Canvas connector boundary
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: canvas-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lti-browser:
    name: Connector LTI Chromium protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install isolated pinned browser tooling
        shell: bash
        run: |
          tools="$RUNNER_TEMP/canvas-lti-browser-tools"
          mkdir -p "$tools"
          cp test/browser-tools/package.json test/browser-tools/package-lock.json "$tools/"
          npm ci --prefix "$tools" --ignore-scripts --no-audit --no-fund
          node "$tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test real Chromium against owned PostgreSQL and HTTPS peers
        shell: bash
        run: python3 scripts/test_lti_state.py --browser-tests "$RUNNER_TEMP/canvas-lti-browser-tools/node_modules/playwright/index.mjs"
      - name: Test operator browser with actual restricted PostgreSQL and OpenBao
        shell: bash
        run: python3 scripts/test_postgres_pool.py --operator-browser-tests "$RUNNER_TEMP/canvas-lti-browser-tools/node_modules/playwright/index.mjs"
  lti-state:
    name: Connector LTI state and browser-proof protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test real PostgreSQL and pinned HTTPS LTI staging and acceptance
        run: python3 scripts/test_lti_state.py
  storage:
    name: Connector PostgreSQL storage contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Test isolated connector storage and concurrent state consumption
        run: python3 scripts/test_postgres_storage.py
  driver:
    name: Connector TLS storage, capture and observation delivery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Test real TLS database, keys, vault, Canvas capture and Gateway delivery
        run: python3 scripts/test_postgres_pool.py
      - name: Test durable automatic capture cadence and backpressure
        run: python3 scripts/test_capture_scheduling.py
  key-custody:
    name: Connector OpenBao key provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Test isolated pinned OpenBao with synthetic keys and read-only token
        run: python3 scripts/test_openbao_key_provider.py
  boundary:
    name: Boundary and HTTPS tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test independent checkout without core sources or credentials
        run: |
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
          npm run check
